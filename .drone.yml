kind: pipeline
type: docker
name: ProyectoM2-CI-CD

trigger:
  event: [ push ]
  branch: [ dev, uat, prod ]

concurrency:
  limit: 1

steps:
  # === BUILD & QUALITY (Backend) ===
  - name: backend-build-test-sonar
    image: maven:3.9-eclipse-temurin-17
    environment:
      SONAR_HOST_URL:
        from_secret: sonar_host_url
      SONAR_TOKEN:
        from_secret: sonar_token
    commands:
      - cd backend
      - mvn -B clean verify
      - mvn -B sonar:sonar -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.login=$SONAR_TOKEN

  - name: sonar-quality-gate
    image: curlimages/curl:8.8.0
    depends_on: [ backend-build-test-sonar ]
    environment:
      SONAR_HOST_URL:
        from_secret: sonar_host_url
      SONAR_TOKEN:
        from_secret: sonar_token
      SONAR_PROJECT_KEY: proyecto-m2-backend   # AJUSTA al key real en Sonar
    commands: |
      for i in $(seq 1 30); do
        s=$(curl -s -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=$SONAR_PROJECT_KEY" \
            | sed -n 's/.*"status":"\([^"]*\)".*/\1/p'); echo "Quality Gate: $s"
        [ "$s" = "OK" ] && exit 0; [ "$s" = "ERROR" ] && exit 1; sleep 5;
      done; echo "Timeout esperando Quality Gate"; exit 1

  # === FRONTEND (opcional) ===
  - name: frontend-build-and-tests
    image: node:20
    depends_on: [ sonar-quality-gate ]
    commands:
      - |
        if [ -d frontend ] && [ -f frontend/package.json ]; then
          cd frontend
          npm ci --no-audit --no-fund
          npm run test:unit || echo "Tests frontend no bloqueantes"
          npm run build
        else
          echo "No hay frontend/ → omitiendo paso"
        fi

  # === DEPLOYS ===
  - name: deploy-dev
    image: docker:26-cli
    when:
      branch: dev
    depends_on: [ frontend-build-and-tests ]
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    environment:
      COMPOSE_DIR: deploy
      NET_NAME: m2-dev-net
      FILE: docker-compose.dev.yml
    commands:
      - apk add --no-cache docker-cli-compose
      - docker network inspect ${NET_NAME} >/dev/null 2>&1 || docker network create ${NET_NAME}
      - cd ${COMPOSE_DIR}
      - docker compose -f ${FILE} down --remove-orphans || true
      - docker compose -f ${FILE} up -d --build

  - name: deploy-uat
    image: docker:26-cli
    when:
      branch: uat
    depends_on: [ frontend-build-and-tests ]
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    environment:
      COMPOSE_DIR: deploy
      NET_NAME: m2-uat-net
      FILE: docker-compose.uat.yml
    commands:
      - apk add --no-cache docker-cli-compose
      - docker network inspect ${NET_NAME} >/dev/null 2>&1 || docker network create ${NET_NAME}
      - cd ${COMPOSE_DIR}
      - docker compose -f ${FILE} down --remove-orphans || true
      - docker compose -f ${FILE} up -d --build

  - name: deploy-prod
    image: docker:26-cli
    when:
      branch: prod
    depends_on: [ frontend-build-and-tests ]
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    environment:
      COMPOSE_DIR: deploy
      NET_NAME: m2-prod-net
      FILE: docker-compose.prod.yml
    commands:
      - apk add --no-cache docker-cli-compose
      - docker network inspect ${NET_NAME} >/dev/null 2>&1 || docker network create ${NET_NAME}
      - cd ${COMPOSE_DIR}
      - docker compose -f ${FILE} down --remove-orphans || true
      - docker compose -f ${FILE} up -d --build

  # === Notificación por correo (en fallo) ===
  - name: notify-failure
    image: appleboy/drone-email
    when:
      status: [ failure ]
    settings:
      host:
        from_secret: smtp_host
      port:
        from_secret: smtp_port
      username:
        from_secret: smtp_user
      password:
        from_secret: smtp_pass
      from:
        from_secret: smtp_from
      subject: "[Drone] Falló ${DRONE_REPO} #${DRONE_BUILD_NUMBER} (${DRONE_BRANCH})"
      recipients:
        - hecheverria@unis.edu.gt
        - jflores@unis.edu.gt
        - magic@ejemplo.com  # cambia al correo real del PO

volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock
