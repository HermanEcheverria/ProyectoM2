kind: pipeline
type: docker
name: ProyectoM2-CI-CD

trigger:
  event: [ push, pull_request ]
  branch: [ dev, uat, prod ]

concurrency:
  limit: 1

steps:
  # ========================
  # =======  PR GATE  ======
  # ========================

  # --- Backend: unit + jacoco (PR) ---
  - name: pr-backend-unit-jacoco
    image: maven:3.9-eclipse-temurin-17
    when:
      event: [ pull_request ]
    commands:
      - cd backend
      - mvn -q clean verify -DskipTests=false
      - mvn -q jacoco:report
      - 'test -f target/site/jacoco/jacoco.xml || { echo "Falta backend/target/site/jacoco/jacoco.xml"; exit 1; }'

  # --- Backend: Sonar (PR) con plugin (sin working_dir) ---
  - name: pr-backend-sonar
    image: aosapps/drone-sonar-plugin
    when:
      event: [ pull_request ]
    depends_on: [ pr-backend-unit-jacoco ]
    settings:
      sonar_host:
        from_secret: sonar_host_url
      sonar_token:
        from_secret: sonar_token
      project_key:    proyecto-m2-backend-pr-${DRONE_PULL_REQUEST}
      project_name:  "proyecto-m2 :: Backend [PR-${DRONE_PULL_REQUEST}]"
      project_version: "${DRONE_BUILD_NUMBER}"
      # analizamos solo la carpeta backend
      sources: backend

  # --- Backend: Quality Gate (PR) ---
  - name: pr-backend-quality-gate
    image: curlimages/curl:8.8.0
    when:
      event: [ pull_request ]
    depends_on: [ pr-backend-sonar ]
    environment:
      SONAR_HOST_URL:
        from_secret: sonar_host_url
      SONAR_TOKEN:
        from_secret: sonar_token
    commands:
      - |
        set -e
        KEY="proyecto-m2-backend-pr-${DRONE_PULL_REQUEST}"
        for i in $(seq 1 30); do
          S=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${KEY}" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
          echo "Quality Gate (backend PR): $S"
          [ "$S" = "OK" ] && exit 0
          [ "$S" = "ERROR" ] && exit 1
          sleep 5
        done
        echo "Timeout esperando Quality Gate (backend PR)"; exit 1

  # --- Frontend: tests + build (PR) ---
  - name: pr-frontend-unit-and-build
    image: node:20
    when:
      event: [ pull_request ]
    depends_on: [ pr-backend-quality-gate ]
    commands:
      - |
        set -e
        cd frontend
        npm ci --no-audit --no-fund
        npm run test:ci || echo "Tests frontend no bloqueantes en PR"
        npm run build || echo "Build frontend no bloqueante en PR"

  # --- Frontend: Sonar (PR) con plugin (sin working_dir) ---
  - name: pr-frontend-sonar
    image: aosapps/drone-sonar-plugin
    when:
      event: [ pull_request ]
    depends_on: [ pr-frontend-unit-and-build ]
    settings:
      sonar_host:
        from_secret: sonar_host_url
      sonar_token:
        from_secret: sonar_token
      project_key:    proyecto-m2-frontend-pr-${DRONE_PULL_REQUEST}
      project_name:  "proyecto-m2 :: Frontend [PR-${DRONE_PULL_REQUEST}]"
      project_version: "${DRONE_BUILD_NUMBER}"
      # analizamos solo la carpeta frontend
      sources: frontend

  # --- Frontend: Quality Gate (PR) ---
  - name: pr-frontend-quality-gate
    image: curlimages/curl:8.8.0
    when:
      event: [ pull_request ]
    depends_on: [ pr-frontend-sonar ]
    environment:
      SONAR_HOST_URL:
        from_secret: sonar_host_url
      SONAR_TOKEN:
        from_secret: sonar_token
    commands:
      - |
        set -e
        KEY="proyecto-m2-frontend-pr-${DRONE_PULL_REQUEST}"
        for i in $(seq 1 30); do
          S=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${KEY}" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
          echo "Quality Gate (frontend PR): $S"
          [ "$S" = "OK" ] && exit 0
          [ "$S" = "ERROR" ] && exit 1
          sleep 5
        done
        echo "Timeout esperando Quality Gate (frontend PR)"; exit 1

  # ===========================
  # =====  RAMAS REALES   =====
  # ===========================

  # --- Backend: build + tests (push) ---
  - name: build-tests-backend
    image: maven:3.9-eclipse-temurin-17
    when:
      event: [ push ]
    commands:
      - cd backend
      - mvn -q clean verify -DskipTests=false
      - mvn -q jacoco:report
      - 'test -f target/site/jacoco/jacoco.xml || { echo "Falta backend/target/site/jacoco/jacoco.xml"; exit 1; }'

  # --- Backend: Sonar (push) con plugin ---
  - name: sonar-backend
    image: aosapps/drone-sonar-plugin
    when:
      event: [ push ]
    depends_on: [ build-tests-backend ]
    settings:
      sonar_host:
        from_secret: sonar_host_url
      sonar_token:
        from_secret: sonar_token
      project_key:    proyecto-m2-backend-${DRONE_BRANCH}
      project_name:  "proyecto-m2 :: Backend [${DRONE_BRANCH}]"
      project_version: "${DRONE_BUILD_NUMBER}"
      sources: backend

  # --- Backend: Quality Gate (push) ---
  - name: qgate-backend
    image: curlimages/curl:8.8.0
    when:
      event: [ push ]
    depends_on: [ sonar-backend ]
    environment:
      SONAR_HOST_URL:
        from_secret: sonar_host_url
      SONAR_TOKEN:
        from_secret: sonar_token
    commands:
      - |
        set -e
        KEY="proyecto-m2-backend-${DRONE_BRANCH}"
        for i in $(seq 1 30); do
          S=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${KEY}" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
          echo "Quality Gate (backend ${DRONE_BRANCH}): $S"
          [ "$S" = "OK" ] && exit 0
          [ "$S" = "ERROR" ] && exit 1
          sleep 5
        done
        echo "Timeout esperando Quality Gate (backend ${DRONE_BRANCH})"; exit 1

  # --- Frontend: tests + build (push) ---
  - name: build-tests-frontend
    image: node:20
    when:
      event: [ push ]
    depends_on: [ qgate-backend ]
    commands:
      - |
        set -e
        cd frontend
        npm ci --no-audit --no-fund
        npm run test:ci || { echo "Falta coverage/lcov.info?"; exit 1; }
        test -f coverage/lcov.info || { echo "Falta frontend/coverage/lcov.info"; exit 1; }
        npm run build

  # --- Frontend: Sonar (push) con plugin ---
  - name: sonar-frontend
    image: aosapps/drone-sonar-plugin
    when:
      event: [ push ]
    depends_on: [ build-tests-frontend ]
    settings:
      sonar_host:
        from_secret: sonar_host_url
      sonar_token:
        from_secret: sonar_token
      project_key:    proyecto-m2-frontend-${DRONE_BRANCH}
      project_name:  "proyecto-m2 :: Frontend [${DRONE_BRANCH}]"
      project_version: "${DRONE_BUILD_NUMBER}"
      sources: frontend

  # --- Frontend: Quality Gate (push) ---
  - name: qgate-frontend
    image: curlimages/curl:8.8.0
    when:
      event: [ push ]
    depends_on: [ sonar-frontend ]
    environment:
      SONAR_HOST_URL:
        from_secret: sonar_host_url
      SONAR_TOKEN:
        from_secret: sonar_token
    commands:
      - |
        set -e
        KEY="proyecto-m2-frontend-${DRONE_BRANCH}"
        for i in $(seq 1 30); do
          S=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${KEY}" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
          echo "Quality Gate (frontend ${DRONE_BRANCH}): $S"
          [ "$S" = "OK" ] && exit 0
          [ "$S" = "ERROR" ] && exit 1
          sleep 5
        done
        echo "Timeout esperando Quality Gate (frontend ${DRONE_BRANCH})"; exit 1

  # =========================
  # =======  DEPLOYS  =======
  # =========================

  - name: deploy-dev
    image: docker:26-cli
    when:
      event: [ push ]
      branch: [ dev ]
    depends_on: [ qgate-frontend ]
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    environment:
      COMPOSE_DIR: deploy
      NET_NAME: m2-dev-net
      FILE: docker-compose.dev.yml
    commands:
      - apk add --no-cache docker-cli-compose
      - docker network inspect ${NET_NAME} >/dev/null 2>&1 || docker network create ${NET_NAME}
      - cd ${COMPOSE_DIR}
      - docker compose -f ${FILE} down --remove-orphans || true
      - docker compose -f ${FILE} up -d --build

  - name: deploy-uat
    image: docker:26-cli
    when:
      event: [ push ]
      branch: [ uat ]
    depends_on: [ qgate-frontend ]
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    environment:
      COMPOSE_DIR: deploy
      NET_NAME: m2-uat-net
      FILE: docker-compose.uat.yml
    commands:
      - apk add --no-cache docker-cli-compose
      - docker network inspect ${NET_NAME} >/dev/null 2>&1 || docker network create ${NET_NAME}
      - cd ${COMPOSE_DIR}
      - docker compose -f ${FILE} down --remove-orphans || true
      - docker compose -f ${FILE} up -d -—build

  - name: deploy-prod
    image: docker:26-cli
    when:
      event: [ push ]
      branch: [ prod ]
    depends_on: [ qgate-frontend ]
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    environment:
      COMPOSE_DIR: deploy
      NET_NAME: m2-prod-net
      FILE: docker-compose.prod.yml
    commands:
      - apk add --no-cache docker-cli-compose
      - docker network inspect ${NET_NAME} >/dev/null 2>&1 || docker network create ${NET_NAME}
      - cd ${COMPOSE_DIR}
      - docker compose -f ${FILE} down --remove-orphans || true
      - docker compose -f ${FILE} up -d --build

  # ===== Notificación por fallo (PR y push) =====
  - name: notify-failure
    image: appleboy/drone-email
    when:
      status: [ failure ]
    settings:
      host:
        from_secret: smtp_host
      port:
        from_secret: smtp_port
      username:
        from_secret: smtp_user
      password:
        from_secret: smtp_pass
      from:
        from_secret: smtp_from
      subject: "[Drone] Falló ${DRONE_REPO} #${DRONE_BUILD_NUMBER} (${DRONE_EVENT} @ ${DRONE_BRANCH})"
      recipients:
        - hecheverria@unis.edu.gt
        - jflores@unis.edu.gt

volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock
