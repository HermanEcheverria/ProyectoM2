kind: pipeline
type: docker
name: ProyectoM2-CI-CD

trigger:
  event: [ push, pull_request ]
  branch: [ dev, uat, prod ]

concurrency:
  limit: 1

steps:
  # ========================
  # =======  PR GATE  ======
  # ========================

  # --- Backend: unit + jacoco (PR) ---
  - name: pr-backend-unit-jacoco
    image: maven:3.9-eclipse-temurin-17
    when:
      event: [ pull_request ]
    commands:
      - cd backend
      - mvn -q clean verify -DskipTests=false
      - mvn -q jacoco:report
      - 'test -f target/site/jacoco/jacoco.xml || { echo "Falta backend/target/site/jacoco/jacoco.xml"; exit 1; }'

  # --- Backend: Sonar (PR) con plugin (lee backend/sonar-project.properties) ---
  - name: pr-backend-sonar (plugin)
    image: aosapps/drone-sonar-plugin
    when:
      event: [ pull_request ]
    depends_on: [ pr-backend-unit-jacoco ]
    working_dir: backend
    settings:
      sonar_host:
        from_secret: sonar_host_url
      sonar_token:
        from_secret: sonar_token

  # --- Backend: Quality Gate (PR) ---
  - name: pr-backend-quality-gate
    image: curlimages/curl:8.8.0
    when:
      event: [ pull_request ]
    depends_on: [ pr-backend-sonar (plugin) ]
    environment:
      SONAR_HOST_URL:
        from_secret: sonar_host_url
      SONAR_TOKEN:
        from_secret: sonar_token
      PROJECT_NAME: proyecto-m2
    commands:
      - |
        set -e
        KEY="${PROJECT_NAME}-backend-pr-${DRONE_PULL_REQUEST}"
        CE_PATH="backend/.scannerwork/report-task.txt"
        [ -f "backend/target/sonar/report-task.txt" ] && CE_PATH="backend/target/sonar/report-task.txt"
        if [ -f "$CE_PATH" ]; then
          CE_TASK=$(sed -n 's/^ceTaskId=\(.*\)$/\1/p' "$CE_PATH")
          for i in $(seq 1 60); do
            STATUS=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/ce/task?id=${CE_TASK}" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
            echo "CE status: $STATUS"
            [ "$STATUS" = "SUCCESS" ] && break
            [ "$STATUS" = "FAILED" ] && echo "CE task FAILED" && exit 1
            sleep 5
          done
        fi
        for i in $(seq 1 30); do
          S=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${KEY}" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
          echo "Quality Gate: $S"
          [ "$S" = "OK" ] && exit 0
          [ "$S" = "ERROR" ] && exit 1
          sleep 5
        done
        echo "Timeout esperando Quality Gate"; exit 1

  # --- Frontend: tests + coverage (PR) (raíz o ./frontend) ---
  - name: pr-frontend-unit-and-coverage
    image: node:20
    when:
      event: [ pull_request ]
    depends_on: [ pr-backend-quality-gate ]
    commands:
      - |
        set -e
        if [ -f package.json ]; then
          npm ci --no-audit --no-fund
          npm run test:ci
          test -f coverage/lcov.info || { echo "Falta coverage/lcov.info en raíz"; exit 1; }
        elif [ -f frontend/package.json ]; then
          cd frontend
          npm ci --no-audit --no-fund
          npm run test:ci
          test -f coverage/lcov.info || { echo "Falta frontend/coverage/lcov.info"; exit 1; }
        else
          echo "No hay frontend → omitiendo"
        fi

  # --- Frontend: Sonar (PR) con plugin (en raíz; si tienes el sonar-project.properties en frontend/, cambia working_dir) ---
  - name: pr-frontend-sonar (plugin)
    image: aosapps/drone-sonar-plugin
    when:
      event: [ pull_request ]
    depends_on: [ pr-frontend-unit-and-coverage ]
    working_dir: .
    settings:
      sonar_host:
        from_secret: sonar_host_url
      sonar_token:
        from_secret: sonar_token

  # --- Frontend: Quality Gate (PR) ---
  - name: pr-frontend-quality-gate
    image: curlimages/curl:8.8.0
    when:
      event: [ pull_request ]
    depends_on: [ pr-frontend-sonar (plugin) ]
    environment:
      SONAR_HOST_URL:
        from_secret: sonar_host_url
      SONAR_TOKEN:
        from_secret: sonar_token
      PROJECT_NAME: proyecto-m2
    commands:
      - |
        set -e
        BASE="."
        [ -f frontend/sonar-project.properties ] && BASE="frontend"
        KEY="${PROJECT_NAME}-frontend-pr-${DRONE_PULL_REQUEST}"
        CE_PATH="${BASE}/.scannerwork/report-task.txt"
        if [ -f "$CE_PATH" ]; then
          CE_TASK=$(sed -n 's/^ceTaskId=\(.*\)$/\1/p' "$CE_PATH")
          for i in $(seq 1 60); do
            STATUS=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/ce/task?id=${CE_TASK}" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
            echo "CE status: $STATUS"
            [ "$STATUS" = "SUCCESS" ] && break
            [ "$STATUS" = "FAILED" ] && echo "CE task FAILED" && exit 1
            sleep 5
          done
        fi
        for i in $(seq 1 30); do
          S=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${KEY}" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
          echo "Quality Gate: $S"
          [ "$S" = "OK" ] && exit 0
          [ "$S" = "ERROR" ] && exit 1
          sleep 5
        done
        echo "Timeout esperando Quality Gate"; exit 1

  # ===========================
  # =====  RAMAS REALES   =====
  # ===========================

  # --- Backend build+tests (push) ---
  - name: build-tests-backend
    image: maven:3.9-eclipse-temurin-17
    when:
      event: [ push ]
    commands:
      - cd backend
      - mvn -q clean verify -DskipTests=false
      - mvn -q jacoco:report
      - 'test -f target/site/jacoco/jacoco.xml || { echo "Falta backend/target/site/jacoco/jacoco.xml"; exit 1; }'

  # --- Backend Sonar (push) con plugin ---
  - name: sonar-backend (plugin)
    image: aosapps/drone-sonar-plugin
    when:
      event: [ push ]
    depends_on: [ build-tests-backend ]
    working_dir: backend
    settings:
      sonar_host:
        from_secret: sonar_host_url
      sonar_token:
        from_secret: sonar_token

  # --- Backend QG (push) ---
  - name: qgate-backend
    image: curlimages/curl:8.8.0
    when:
      event: [ push ]
    depends_on: [ sonar-backend (plugin) ]
    environment:
      SONAR_HOST_URL:
        from_secret: sonar_host_url
      SONAR_TOKEN:
        from_secret: sonar_token
      PROJECT_NAME: proyecto-m2
    commands:
      - |
        set -e
        KEY="${PROJECT_NAME}-backend-${DRONE_BRANCH}"
        CE_PATH="backend/.scannerwork/report-task.txt"
        [ -f "backend/target/sonar/report-task.txt" ] && CE_PATH="backend/target/sonar/report-task.txt"
        if [ -f "$CE_PATH" ]; then
          CE_TASK=$(sed -n 's/^ceTaskId=\(.*\)$/\1/p' "$CE_PATH")
          for i in $(seq 1 60); do
            STATUS=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/ce/task?id=${CE_TASK}" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
            echo "CE status: $STATUS"
            [ "$STATUS" = "SUCCESS" ] && break
            [ "$STATUS" = "FAILED" ] && echo "CE task FAILED" && exit 1
            sleep 5
          done
        fi
        for i in $(seq 1 30); do
          S=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${KEY}" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
          echo "Quality Gate: $S"
          [ "$S" = "OK" ] && exit 0
          [ "$S" = "ERROR" ] && exit 1
          sleep 5
        done
        echo "Timeout esperando Quality Gate"; exit 1

  # --- Frontend build+tests (push) ---
  - name: build-tests-frontend
    image: node:20
    when:
      event: [ push ]
    depends_on: [ qgate-backend ]
    commands:
      - |
        set -e
        if [ -f package.json ]; then
          npm ci --no-audit --no-fund
          npm run test:ci
          test -f coverage/lcov.info || { echo "Falta coverage/lcov.info en raíz"; exit 1; }
          npm run build
        elif [ -f frontend/package.json ]; then
          cd frontend
          npm ci --no-audit --no-fund
          npm run test:ci
          test -f coverage/lcov.info || { echo "Falta frontend/coverage/lcov.info"; exit 1; }
          npm run build
        else
          echo "No hay frontend → omitiendo"
        fi

  # --- Frontend Sonar (push) con plugin ---
  - name: sonar-frontend (plugin)
    image: aosapps/drone-sonar-plugin
    when:
      event: [ push ]
    depends_on: [ build-tests-frontend ]
    working_dir: .
    settings:
      sonar_host:
        from_secret: sonar_host_url
      sonar_token:
        from_secret: sonar_token

  # --- Frontend QG (push) ---
  - name: qgate-frontend
    image: curlimages/curl:8.8.0
    when:
      event: [ push ]
    depends_on: [ sonar-frontend (plugin) ]
    environment:
      SONAR_HOST_URL:
        from_secret: sonar_host_url
      SONAR_TOKEN:
        from_secret: sonar_token
      PROJECT_NAME: proyecto-m2
    commands:
      - |
        set -e
        BASE="."
        [ -f frontend/sonar-project.properties ] && BASE="frontend"
        KEY="${PROJECT_NAME}-frontend-${DRONE_BRANCH}"
        CE_PATH="${BASE}/.scannerwork/report-task.txt"
        if [ -f "$CE_PATH" ]; then
          CE_TASK=$(sed -n 's/^ceTaskId=\(.*\)$/\1/p' "$CE_PATH")
          for i in $(seq 1 60); do
            STATUS=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/ce/task?id=${CE_TASK}" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
            echo "CE status: $STATUS"
            [ "$STATUS" = "SUCCESS" ] && break
            [ "$STATUS" = "FAILED" ] && echo "CE task FAILED" && exit 1
            sleep 5
          done
        fi
        for i in $(seq 1 30); do
          S=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${KEY}" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
          echo "Quality Gate: $S"
          [ "$S" = "OK" ] && exit 0
          [ "$S" = "ERROR" ] && exit 1
          sleep 5
        done
        echo "Timeout esperando Quality Gate"; exit 1

  # =========================
  # =======  DEPLOYS  =======
  # =========================

  - name: deploy-dev
    image: docker:26-cli
    when:
      event: [ push ]
      branch: [ dev ]
    depends_on: [ qgate-frontend ]
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    environment:
      COMPOSE_DIR: deploy
      NET_NAME: m2-dev-net
      FILE: docker-compose.dev.yml
    commands:
      - apk add --no-cache docker-cli-compose
      - docker network inspect ${NET_NAME} >/dev/null 2>&1 || docker network create ${NET_NAME}
      - cd ${COMPOSE_DIR}
      - docker compose -f ${FILE} down --remove-orphans || true
      - docker compose -f ${FILE} up -d --build

  - name: deploy-uat
    image: docker:26-cli
    when:
      event: [ push ]
      branch: [ uat ]
    depends_on: [ qgate-frontend ]
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    environment:
      COMPOSE_DIR: deploy
      NET_NAME: m2-uat-net
      FILE: docker-compose.uat.yml
    commands:
      - apk add --no-cache docker-cli-compose
      - docker network inspect ${NET_NAME} >/dev/null 2>&1 || docker network create ${NET_NAME}
      - cd ${COMPOSE_DIR}
      - docker compose -f ${FILE} down --remove-orphans || true
      - docker compose -f ${FILE} up -d --build

  - name: deploy-prod
    image: docker:26-cli
    when:
      event: [ push ]
      branch: [ prod ]
    depends_on: [ qgate-frontend ]
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    environment:
      COMPOSE_DIR: deploy
      NET_NAME: m2-prod-net
      FILE: docker-compose.prod.yml
    commands:
      - apk add --no-cache docker-cli-compose
      - docker network inspect ${NET_NAME} >/dev/null 2>&1 || docker network create ${NET_NAME}
      - cd ${COMPOSE_DIR}
      - docker compose -f ${FILE} down --remove-orphans || true
      - docker compose -f ${FILE} up -d --build

  # ===== Notificación por fallo =====
  - name: notify-failure
    image: appleboy/drone-email
    when:
      status: [ failure ]
    settings:
      host:
        from_secret: smtp_host
      port:
        from_secret: smtp_port
      username:
        from_secret: smtp_user
      password:
        from_secret: smtp_pass
      from:
        from_secret: smtp_from
      subject: "[Drone] Falló ${DRONE_REPO} #${DRONE_BUILD_NUMBER} (${DRONE_EVENT} @ ${DRONE_BRANCH})"
      recipients:
        - hecheverria@unis.edu.gt
        - jflores@unis.edu.gt

volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock
