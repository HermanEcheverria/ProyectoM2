kind: pipeline
type: docker
name: ProyectoM2-CI-CD

trigger:
  event: [ push, pull_request ]
  branch: [ dev, uat, prod ]

concurrency:
  limit: 1

steps:
  # ========================
  # =======  PR GATE  ======
  # ========================
  - name: pr-backend-unit-jacoco
    image: maven:3.9-eclipse-temurin-17
    when:
      event: [ pull_request ]
    commands:
      - cd backend
      - mvn -q clean verify -DskipTests=false
      - mvn -q jacoco:report
      - 'test -f target/site/jacoco/jacoco.xml || { echo "Falta backend/target/site/jacoco/jacoco.xml"; exit 1; }'

  # Scanner + Quality Gate (PR, Backend)
  - name: pr-backend-sonar-and-qgate
    image: sonarsource/sonar-scanner-cli:5
    when:
      event: [ pull_request ]
    depends_on: [ pr-backend-unit-jacoco ]
    environment:
      SONAR_HOST_URL:
        from_secret: sonar_host_url
      SONAR_TOKEN:
        from_secret: sonar_token
    commands:
      - |
        set -euo pipefail
        cd backend
        KEY="proyecto-m2-backend-pr-${DRONE_PULL_REQUEST}"
        NAME="proyecto-m2 :: Backend [PR-${DRONE_PULL_REQUEST}]"
        [ -n "${SONAR_HOST_URL:-}" ] || { echo "Falta secret sonar_host_url"; exit 2; }
        [ -n "${SONAR_TOKEN:-}" ]    || { echo "Falta secret sonar_token"; exit 2; }

        # Analiza
        sonar-scanner \
          -Dsonar.host.url="${SONAR_HOST_URL}" \
          -Dsonar.token="${SONAR_TOKEN}" \
          -Dsonar.projectKey="${KEY}" \
          -Dsonar.projectName="${NAME}"

        # Instala curl y espera CE + Quality Gate
        apk add --no-cache curl >/dev/null
        CE_PATH="backend/.scannerwork/report-task.txt"
        [ -f "backend/target/sonar/report-task.txt" ] && CE_PATH="backend/target/sonar/report-task.txt"
        if [ -f "$CE_PATH" ]; then
          CE_TASK=$(sed -n 's/^ceTaskId=\(.*\)$/\1/p' "$CE_PATH")
          for i in $(seq 1 60); do
            STATUS=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/ce/task?id=${CE_TASK}" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
            echo "CE status: $STATUS"
            [ "$STATUS" = "SUCCESS" ] && break
            [ "$STATUS" = "FAILED" ] && echo "CE task FAILED" && exit 1
            sleep 5
          done
        fi
        for i in $(seq 1 30); do
          S=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${KEY}" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
          echo "Quality Gate (backend PR): $S"
          [ "$S" = "OK" ] && exit 0
          [ "$S" = "ERROR" ] && exit 1
          sleep 5
        done
        echo "Timeout esperando Quality Gate (backend PR)"; exit 1

  - name: pr-frontend-unit-and-build
    image: node:20
    when:
      event: [ pull_request ]
    depends_on: [ pr-backend-sonar-and-qgate ]
    commands:
      - |
        set -e
        cd frontend
        npm ci --no-audit --no-fund
        npm run test:ci || echo "Tests frontend no bloqueantes en PR"
        npm run build   || echo "Build frontend no bloqueante en PR"

  # Scanner + Quality Gate (PR, Frontend)
  - name: pr-frontend-sonar-and-qgate
    image: sonarsource/sonar-scanner-cli:5
    when:
      event: [ pull_request ]
    depends_on: [ pr-frontend-unit-and-build ]
    environment:
      SONAR_HOST_URL:
        from_secret: sonar_host_url
      SONAR_TOKEN:
        from_secret: sonar_token
    commands:
      - |
        set -euo pipefail
        cd frontend
        KEY="proyecto-m2-frontend-pr-${DRONE_PULL_REQUEST}"
        NAME="proyecto-m2 :: Frontend [PR-${DRONE_PULL_REQUEST}]"
        [ -n "${SONAR_HOST_URL:-}" ] || { echo "Falta secret sonar_host_url"; exit 2; }
        [ -n "${SONAR_TOKEN:-}" ]    || { echo "Falta secret sonar_token"; exit 2; }

        sonar-scanner \
          -Dsonar.host.url="${SONAR_HOST_URL}" \
          -Dsonar.token="${SONAR_TOKEN}" \
          -Dsonar.projectKey="${KEY}" \
          -Dsonar.projectName="${NAME}"

        apk add --no-cache curl >/dev/null
        CE_PATH="frontend/.scannerwork/report-task.txt"
        [ -f "frontend/target/sonar/report-task.txt" ] && CE_PATH="frontend/target/sonar/report-task.txt"
        if [ -f "$CE_PATH" ]; then
          CE_TASK=$(sed -n 's/^ceTaskId=\(.*\)$/\1/p' "$CE_PATH")
          for i in $(seq 1 60); do
            STATUS=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/ce/task?id=${CE_TASK}" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
            echo "CE status: $STATUS"
            [ "$STATUS" = "SUCCESS" ] && break
            [ "$STATUS" = "FAILED" ] && echo "CE task FAILED" && exit 1
            sleep 5
          done
        fi
        for i in $(seq 1 30); do
          S=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${KEY}" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
          echo "Quality Gate (frontend PR): $S"
          [ "$S" = "OK" ] && exit 0
          [ "$S" = "ERROR" ] && exit 1
          sleep 5
        done
        echo "Timeout esperando Quality Gate (frontend PR)"; exit 1

  # ===========================
  # =====  RAMAS REALES   =====
  # ===========================
  - name: build-tests-backend
    image: maven:3.9-eclipse-temurin-17
    when:
      event: [ push ]
    commands:
      - cd backend
      - mvn -q clean verify -DskipTests=false
      - mvn -q jacoco:report
      - 'test -f target/site/jacoco/jacoco.xml || { echo "Falta backend/target/site/jacoco/jacoco.xml"; exit 1; }'

  # Scanner + Quality Gate (push, Backend)
  - name: sonar-backend-and-qgate
    image: sonarsource/sonar-scanner-cli:5
    when:
      event: [ push ]
    depends_on: [ build-tests-backend ]
    environment:
      SONAR_HOST_URL:
        from_secret: sonar_host_url
      SONAR_TOKEN:
        from_secret: sonar_token
    commands:
      - |
        set -euo pipefail
        cd backend
        RAW="${DRONE_BRANCH:-dev}"
        KEY="proyecto-m2-backend-${RAW}"
        NAME="proyecto-m2 :: Backend [${RAW}]"
        [ -n "${SONAR_HOST_URL:-}" ] || { echo "Falta secret sonar_host_url"; exit 2; }
        [ -n "${SONAR_TOKEN:-}" ]    || { echo "Falta secret sonar_token"; exit 2; }

        sonar-scanner \
          -Dsonar.host.url="${SONAR_HOST_URL}" \
          -Dsonar.token="${SONAR_TOKEN}" \
          -Dsonar.projectKey="${KEY}" \
          -Dsonar.projectName="${NAME}" \
          $( [ "${RAW}" = "prod" ] && echo "-Dsonar.projectVersion=${DRONE_BUILD_NUMBER}" )

        apk add --no-cache curl >/dev/null
        CE_PATH="backend/.scannerwork/report-task.txt"
        [ -f "backend/target/sonar/report-task.txt" ] && CE_PATH="backend/target/sonar/report-task.txt"
        if [ -f "$CE_PATH" ]; then
          CE_TASK=$(sed -n 's/^ceTaskId=\(.*\)$/\1/p' "$CE_PATH")
          for i in $(seq 1 60); do
            STATUS=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/ce/task?id=${CE_TASK}" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
            echo "CE status: $STATUS"
            [ "$STATUS" = "SUCCESS" ] && break
            [ "$STATUS" = "FAILED" ] && echo "CE task FAILED" && exit 1
            sleep 5
          done
        fi
        for i in $(seq 1 30); do
          S=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${KEY}" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
          echo "Quality Gate (backend ${RAW}): $S"
          [ "$S" = "OK" ] && exit 0
          [ "$S" = "ERROR" ] && exit 1
          sleep 5
        done
        echo "Timeout esperando Quality Gate (backend ${RAW})"; exit 1

  - name: build-tests-frontend
    image: node:20
    when:
      event: [ push ]
    depends_on: [ sonar-backend-and-qgate ]
    commands:
      - |
        set -e
        cd frontend
        npm ci --no-audit --no-fund
        npm run test:ci
        test -f coverage/lcov.info || { echo "Falta frontend/coverage/lcov.info"; exit 1; }
        npm run build

  # Scanner + Quality Gate (push, Frontend)
  - name: sonar-frontend-and-qgate
    image: sonarsource/sonar-scanner-cli:5
    when:
      event: [ push ]
    depends_on: [ build-tests-frontend ]
    environment:
      SONAR_HOST_URL:
        from_secret: sonar_host_url
      SONAR_TOKEN:
        from_secret: sonar_token
    commands:
      - |
        set -euo pipefail
        cd frontend
        RAW="${DRONE_BRANCH:-dev}"
        KEY="proyecto-m2-frontend-${RAW}"
        NAME="proyecto-m2 :: Frontend [${RAW}]"
        [ -n "${SONAR_HOST_URL:-}" ] || { echo "Falta secret sonar_host_url"; exit 2; }
        [ -n "${SONAR_TOKEN:-}" ]    || { echo "Falta secret sonar_token"; exit 2; }

        sonar-scanner \
          -Dsonar.host.url="${SONAR_HOST_URL}" \
          -Dsonar.token="${SONAR_TOKEN}" \
          -Dsonar.projectKey="${KEY}" \
          -Dsonar.projectName="${NAME}" \
          $( [ "${RAW}" = "prod" ] && echo "-Dsonar.projectVersion=${DRONE_BUILD_NUMBER}" )

        apk add --no-cache curl >/dev/null
        CE_PATH="frontend/.scannerwork/report-task.txt"
        [ -f "frontend/target/sonar/report-task.txt" ] && CE_PATH="frontend/target/sonar/report-task.txt"
        if [ -f "$CE_PATH" ]; then
          CE_TASK=$(sed -n 's/^ceTaskId=\(.*\)$/\1/p' "$CE_PATH")
          for i in $(seq 1 60); do
            STATUS=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/ce/task?id=${CE_TASK}" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
            echo "CE status: $STATUS"
            [ "$STATUS" = "SUCCESS" ] && break
            [ "$STATUS" = "FAILED" ] && echo "CE task FAILED" && exit 1
            sleep 5
          done
        fi
        for i in $(seq 1 30); do
          S=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${KEY}" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
          echo "Quality Gate (frontend ${RAW}): $S"
          [ "$S" = "OK" ] && exit 0
          [ "$S" = "ERROR" ] && exit 1
          sleep 5
        done
        echo "Timeout esperando Quality Gate (frontend ${RAW})"; exit 1

  # =========================
  # =======  DEPLOYS  =======
  # =========================
  - name: deploy-dev
    image: docker:26-cli
    when:
      event: [ push ]
      branch: [ dev ]
    depends_on: [ sonar-frontend-and-qgate ]
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    environment:
      COMPOSE_DIR: deploy
      NET_NAME: m2-dev-net
      FILE: docker-compose.dev.yml
    commands:
      - apk add --no-cache docker-cli-compose
      - docker network inspect ${NET_NAME} >/dev/null 2>&1 || docker network create ${NET_NAME}
      - cd ${COMPOSE_DIR}
      - docker compose -f ${FILE} down --remove-orphans || true
      - docker compose -f ${FILE} up -d --build

  - name: deploy-uat
    image: docker:26-cli
    when:
      event: [ push ]
      branch: [ uat ]
    depends_on: [ sonar-frontend-and-qgate ]
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    environment:
      COMPOSE_DIR: deploy
      NET_NAME: m2-uat-net
      FILE: docker-compose.uat.yml
    commands:
      - apk add --no-cache docker-cli-compose
      - docker network inspect ${NET_NAME} >/dev/null 2>&1 || docker network create ${NET_NAME}
      - cd ${COMPOSE_DIR}
      - docker compose -f ${FILE} down --remove-orphans || true
      - docker compose -f ${FILE} up -d --build

  - name: deploy-prod
    image: docker:26-cli
    when:
      event: [ push ]
      branch: [ prod ]
    depends_on: [ sonar-frontend-and-qgate ]
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    environment:
      COMPOSE_DIR: deploy
      NET_NAME: m2-prod-net
      FILE: docker-compose.prod.yml
    commands:
      - apk add --no-cache docker-cli-compose
      - docker network inspect ${NET_NAME} >/dev/null 2>&1 || docker network create ${NET_NAME}
      - cd ${COMPOSE_DIR}
      - docker compose -f ${FILE} down --remove-orphans || true
      - docker compose -f ${FILE} up -d --build

  - name: notify-failure
    image: appleboy/drone-email
    when:
      status: [ failure ]
    settings:
      host:
        from_secret: smtp_host
      port:
        from_secret: smtp_port
      username:
        from_secret: smtp_user
      password:
        from_secret: smtp_pass
      from:
        from_secret: smtp_from
      subject: "[Drone] Falló ${DRONE_REPO} #${DRONE_BUILD_NUMBER} (${DRONE_EVENT} @ ${DRONE_BRANCH})"
      recipients:
        - hecheverria@unis.edu.gt
        - jflores@unis.edu.gt

volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock
