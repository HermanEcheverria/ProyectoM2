kind: pipeline
type: docker
name: ProyectoM2-CI-CD

trigger:
  event: [ push, pull_request ]
  branch: [ dev, uat, prod ]

concurrency:
  limit: 1

steps:
  # ========================
  # =======  PR GATE  ======
  # ========================
  - name: pr-backend-unit-jacoco
    image: maven:3.9-eclipse-temurin-17
    when:
      event: [ pull_request ]
    commands:
      - cd backend
      - mvn -q clean verify -DskipTests=false
      - mvn -q jacoco:report
      - 'test -f target/site/jacoco/jacoco.xml || { echo "Falta backend/target/site/jacoco/jacoco.xml"; exit 1; }'

  - name: pr-backend-sonar+qgate
    image: sonarsource/sonar-scanner-cli:5
    when:
      event: [ pull_request ]
    depends_on: [ pr-backend-unit-jacoco ]
    # IMPORTANTE: usar settings → Drone las expondrá como PLUGIN_SONAR_HOST / PLUGIN_SONAR_TOKEN
    settings:
      sonar_host_url:
        from_secret: sonar_host_url
      sonar_token:
        from_secret: sonar_token
    environment:
      PROJECT_NAME: proyecto-m2
    commands:
      - |
        set -euo pipefail
        cd backend

        # Mapear desde settings (PLUGIN_*). Dejar fallback por si algún runner antiguo usa minúsculas.
        SONAR_HOST_URL="${PLUGIN_SONAR_HOST_URL:-${PLUGIN_SONAR_HOST:-${sonar_host_url:-}}}"
        SONAR_TOKEN="${PLUGIN_SONAR_TOKEN:-${sonar_token:-}}"

        # Validar
        [ -n "${SONAR_HOST_URL}" ] || { echo "Falta secret sonar_host_url"; exit 2; }
        [ -n "${SONAR_TOKEN}" ]    || { echo "Falta secret sonar_token"; exit 2; }

        KEY="${PROJECT_NAME}-backend-pr-${DRONE_PULL_REQUEST}"
        NAME="${PROJECT_NAME} :: Backend [PR-${DRONE_PULL_REQUEST}]"

        sonar-scanner \
          -Dsonar.host.url="${SONAR_HOST_URL}" \
          -Dsonar.token="${SONAR_TOKEN}" \
          -Dsonar.projectKey="${KEY}" \
          -Dsonar.projectName="${NAME}"

        # === Esperar cola CE + Quality Gate ===
        apk add --no-cache curl >/dev/null
        CE_PATH=".scannerwork/report-task.txt"
        [ -f "target/sonar/report-task.txt" ] && CE_PATH="target/sonar/report-task.txt"

        if [ -f "$CE_PATH" ]; then
          CE_TASK=$(sed -n 's/^ceTaskId=\(.*\)$/\1/p' "$CE_PATH")
          for i in $(seq 1 60); do
            STATUS=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/ce/task?id=${CE_TASK}" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
            echo "CE status: $STATUS"
            [ "$STATUS" = "SUCCESS" ] && break
            [ "$STATUS" = "FAILED" ] && echo "CE task FAILED" && exit 1
            sleep 5
          done
        fi

        for i in $(seq 1 30); do
          S=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${KEY}" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
          echo "Quality Gate: $S"
          [ "$S" = "OK" ] && exit 0
          [ "$S" = "ERROR" ] && exit 1
          sleep 5
        done
        echo "Timeout esperando Quality Gate (backend PR)"; exit 1

  - name: pr-frontend-tests
    image: node:20
    when:
      event: [ pull_request ]
    depends_on: [ pr-backend-sonar+qgate ]
    commands:
      - |
        set -e
        if [ -f package.json ]; then
          npm ci --no-audit --no-fund
          npm run test:ci
          test -f coverage/lcov.info || { echo "Falta coverage/lcov.info en raíz"; exit 1; }
        elif [ -f frontend/package.json ]; then
          cd frontend
          npm ci --no-audit --no-fund
          npm run test:ci
          test -f coverage/lcov.info || { echo "Falta frontend/coverage/lcov.info"; exit 1; }
        else
          echo "No hay frontend → omitiendo"
        fi

  - name: pr-frontend-sonar+qgate
    image: sonarsource/sonar-scanner-cli:5
    when:
      event: [ pull_request ]
    depends_on: [ pr-frontend-tests ]
    settings:
      sonar_host_url:
        from_secret: sonar_host_url
      sonar_token:
        from_secret: sonar_token
    environment:
      PROJECT_NAME: proyecto-m2
    commands:
      - |
        set -euo pipefail
        SONAR_HOST_URL="${PLUGIN_SONAR_HOST_URL:-${PLUGIN_SONAR_HOST:-${sonar_host_url:-}}}"
        SONAR_TOKEN="${PLUGIN_SONAR_TOKEN:-${sonar_token:-}}"
        [ -n "${SONAR_HOST_URL}" ] || { echo "Falta secret sonar_host_url"; exit 2; }
        [ -n "${SONAR_TOKEN}" ]    || { echo "Falta secret sonar_token"; exit 2; }

        KEY="${PROJECT_NAME}-frontend-pr-${DRONE_PULL_REQUEST}"
        NAME="${PROJECT_NAME} :: Frontend [PR-${DRONE_PULL_REQUEST}]"

        BASE="."
        if [ -f frontend/sonar-project.properties ]; then BASE="frontend"; fi
        cd "$BASE"

        sonar-scanner \
          -Dsonar.host.url="${SONAR_HOST_URL}" \
          -Dsonar.token="${SONAR_TOKEN}" \
          -Dsonar.projectKey="${KEY}" \
          -Dsonar.projectName="${NAME}"

        apk add --no-cache curl >/dev/null
        CE_PATH=".scannerwork/report-task.txt"
        if [ -f "$CE_PATH" ]; then
          CE_TASK=$(sed -n 's/^ceTaskId=\(.*\)$/\1/p' "$CE_PATH")
          for i in $(seq 1 60); do
            STATUS=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/ce/task?id=${CE_TASK}" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
            echo "CE status: $STATUS"
            [ "$STATUS" = "SUCCESS" ] && break
            [ "$STATUS" = "FAILED" ] && echo "CE task FAILED" && exit 1
            sleep 5
          done
        fi
        for i in $(seq 1 30); do
          S=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${KEY}" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
          echo "Quality Gate: $S"
          [ "$S" = "OK" ] && exit 0
          [ "$S" = "ERROR" ] && exit 1
          sleep 5
        done
        echo "Timeout esperando Quality Gate (frontend PR)"; exit 1

  # ===========================
  # =====  RAMAS REALES   =====
  # ===========================
  - name: build-tests-backend
    image: maven:3.9-eclipse-temurin-17
    when:
      event: [ push ]
    commands:
      - cd backend
      - mvn -q clean verify -DskipTests=false
      - mvn -q jacoco:report
      - 'test -f target/site/jacoco/jacoco.xml || { echo "Falta backend/target/site/jacoco/jacoco.xml"; exit 1; }'

  - name: sonar-backend+qgate
    image: sonarsource/sonar-scanner-cli:5
    when:
      event: [ push ]
    depends_on: [ build-tests-backend ]
    settings:
      sonar_host_url:
        from_secret: sonar_host_url
      sonar_token:
        from_secret: sonar_token
    environment:
      PROJECT_NAME: proyecto-m2
    commands:
      - |
        set -euo pipefail
        cd backend
        SONAR_HOST_URL="${PLUGIN_SONAR_HOST_URL:-${PLUGIN_SONAR_HOST:-${sonar_host_url:-}}}"
        SONAR_TOKEN="${PLUGIN_SONAR_TOKEN:-${sonar_token:-}}"
        [ -n "${SONAR_HOST_URL}" ] || { echo "Falta secret sonar_host_url"; exit 2; }
        [ -n "${SONAR_TOKEN}" ]    || { echo "Falta secret sonar_token"; exit 2; }

        RAW="${DRONE_BRANCH:-dev}"
        KEY="${PROJECT_NAME}-backend-${RAW}"
        NAME="${PROJECT_NAME} :: Backend [${RAW}]"
        EXTS=""
        if [ "$RAW" = "prod" ]; then
          git fetch --tags --force >/dev/null 2>&1 || true
          VER=$(git describe --tags --always 2>/dev/null || echo "${DRONE_BUILD_NUMBER}")
          EXTS="$EXTS -Dsonar.projectVersion=${VER}"
        fi

        sonar-scanner \
          -Dsonar.host.url="${SONAR_HOST_URL}" \
          -Dsonar.token="${SONAR_TOKEN}" \
          -Dsonar.projectKey="${KEY}" \
          -Dsonar.projectName="${NAME}" \
          ${EXTS}

        apk add --no-cache curl >/dev/null
        CE_PATH=".scannerwork/report-task.txt"
        [ -f "target/sonar/report-task.txt" ] && CE_PATH="target/sonar/report-task.txt"
        if [ -f "$CE_PATH" ]; then
          CE_TASK=$(sed -n 's/^ceTaskId=\(.*\)$/\1/p' "$CE_PATH")
          for i in $(seq 1 60); do
            STATUS=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/ce/task?id=${CE_TASK}" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
            echo "CE status: $STATUS"
            [ "$STATUS" = "SUCCESS" ] && break
            [ "$STATUS" = "FAILED" ] && echo "CE task FAILED" && exit 1
            sleep 5
          done
        fi
        for i in $(seq 1 30); do
          S=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${KEY}" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
          echo "Quality Gate (backend ${RAW}): $S"
          [ "$S" = "OK" ] && exit 0
          [ "$S" = "ERROR" ] && exit 1
          sleep 5
        done
        echo "Timeout esperando Quality Gate (backend ${RAW})"; exit 1

  - name: build-tests-frontend
    image: node:20
    when:
      event: [ push ]
    depends_on: [ sonar-backend+qgate ]
    commands:
      - |
        set -e
        if [ -f package.json ]; then
          npm ci --no-audit --no-fund
          npm run test:ci
          test -f coverage/lcov.info || { echo "Falta coverage/lcov.info en raíz"; exit 1; }
          npm run build
        elif [ -f frontend/package.json ]; then
          cd frontend
          npm ci --no-audit --no-fund
          npm run test:ci
          test -f coverage/lcov.info || { echo "Falta frontend/coverage/lcov.info"; exit 1; }
          npm run build
        else
          echo "No hay frontend → omitiendo"
        fi

  - name: sonar-frontend+qgate
    image: sonarsource/sonar-scanner-cli:5
    when:
      event: [ push ]
    depends_on: [ build-tests-frontend ]
    settings:
      sonar_host_url:
        from_secret: sonar_host_url
      sonar_token:
        from_secret: sonar_token
    environment:
      PROJECT_NAME: proyecto-m2
    commands:
      - |
        set -euo pipefail
        SONAR_HOST_URL="${PLUGIN_SONAR_HOST_URL:-${PLUGIN_SONAR_HOST:-${sonar_host_url:-}}}"
        SONAR_TOKEN="${PLUGIN_SONAR_TOKEN:-${sonar_token:-}}"
        [ -n "${SONAR_HOST_URL}" ] || { echo "Falta secret sonar_host_url"; exit 2; }
        [ -n "${SONAR_TOKEN}" ]    || { echo "Falta secret sonar_token"; exit 2; }

        RAW="${DRONE_BRANCH:-dev}"
        KEY="${PROJECT_NAME}-frontend-${RAW}"
        NAME="${PROJECT_NAME} :: Frontend [${RAW}]"

        BASE="."
        if [ -f frontend/sonar-project.properties ]; then BASE="frontend"; fi
        cd "$BASE"

        sonar-scanner \
          -Dsonar.host.url="${SONAR_HOST_URL}" \
          -Dsonar.token="${SONAR_TOKEN}" \
          -Dsonar.projectKey="${KEY}" \
          -Dsonar.projectName="${NAME}"

        apk add --no-cache curl >/dev/null
        CE_PATH=".scannerwork/report-task.txt"
        if [ -f "$CE_PATH" ]; then
          CE_TASK=$(sed -n 's/^ceTaskId=\(.*\)$/\1/p' "$CE_PATH")
          for i in $(seq 1 60); do
            STATUS=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/ce/task?id=${CE_TASK}" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
            echo "CE status: $STATUS"
            [ "$STATUS" = "SUCCESS" ] && break
            [ "$STATUS" = "FAILED" ] && echo "CE task FAILED" && exit 1
            sleep 5
          done
        fi
        for i in $(seq 1 30); do
          S=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${KEY}" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
          echo "Quality Gate (frontend ${RAW}): $S"
          [ "$S" = "OK" ] && exit 0
          [ "$S" = "ERROR" ] && exit 1
          sleep 5
        done
        echo "Timeout esperando Quality Gate (frontend ${RAW})"; exit 1

  # =========================
  # =======  DEPLOYS  =======
  # =========================
  - name: deploy-dev
    image: docker:26-cli
    when:
      event: [ push ]
      branch: [ dev ]
    depends_on: [ sonar-frontend+qgate ]
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    environment:
      COMPOSE_DIR: deploy
      NET_NAME: m2-dev-net
      FILE: docker-compose.dev.yml
    commands:
      - apk add --no-cache docker-cli-compose
      - docker network inspect ${NET_NAME} >/dev/null 2>&1 || docker network create ${NET_NAME}
      - cd ${COMPOSE_DIR}
      - docker compose -f ${FILE} down --remove-orphans || true
      - docker compose -f ${FILE} up -d --build

  - name: deploy-uat
    image: docker:26-cli
    when:
      event: [ push ]
      branch: [ uat ]
    depends_on: [ sonar-frontend+qgate ]
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    environment:
      COMPOSE_DIR: deploy
      NET_NAME: m2-uat-net
      FILE: docker-compose.uat.yml
    commands:
      - apk add --no-cache docker-cli-compose
      - docker network inspect ${NET_NAME} >/dev/null 2>&1 || docker network create ${NET_NAME}
      - cd ${COMPOSE_DIR}
      - docker compose -f ${FILE} down --remove-orphans || true
      - docker compose -f ${FILE} up -d --build

  - name: deploy-prod
    image: docker:26-cli
    when:
      event: [ push ]
      branch: [ prod ]
    depends_on: [ sonar-frontend+qgate ]
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    environment:
      COMPOSE_DIR: deploy
      NET_NAME: m2-prod-net
      FILE: docker-compose.prod.yml
    commands:
      - apk add --no-cache docker-cli-compose
      - docker network inspect ${NET_NAME} >/dev/null 2>&1 || docker network create ${NET_NAME}
      - cd ${COMPOSE_DIR}
      - docker compose -f ${FILE} down --remove-orphans || true
      - docker compose -f ${FILE} up -d --build

  - name: notify-failure
    image: appleboy/drone-email
    when:
      status: [ failure ]
    settings:
      host:
        from_secret: smtp_host
      port:
        from_secret: smtp_port
      username:
        from_secret: smtp_user
      password:
        from_secret: smtp_pass
      from:
        from_secret: smtp_from
      subject: "[Drone] Falló ${DRONE_REPO} #${DRONE_BUILD_NUMBER} (${DRONE_EVENT} @ ${DRONE_BRANCH})"
      recipients:
        - hecheverria@unis.edu.gt
        - jflores@unis.edu.gt

volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock
