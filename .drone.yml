kind: pipeline
type: docker
name: ProyectoM2-CI-CD

workspace:
  base: /drone
  path: src

clone:
  depth: 50

trigger:
  event: [ push, pull_request ]
  branch: [ dev, uat, prod ]

concurrency:
  limit: 1

steps:
  # =========================
  # =======   CHECKOUT  =====
  # =========================
  - name: checkout
    image: alpine/git
    commands:
      - git fetch --all
      - git reset --hard origin/${DRONE_BRANCH}

  # =========================
  # === BACKEND (tests + sonar)
  # =========================
  - name: build-backend
    image: maven:3.9-eclipse-temurin-17
    depends_on: [ checkout ]
    commands:
      - |
        set -eu
        if [ ! -f backend/pom.xml ]; then
          echo "No hay backend → omitiendo build"
          exit 0
        fi
        cd backend
        mvn -q -B clean install -DskipTests

  - name: test-backend
    image: maven:3.9-eclipse-temurin-17
    depends_on: [ build-backend ]
    commands:
      - |
        set -eu
        if [ ! -f backend/pom.xml ]; then
          echo "No hay backend → omitiendo tests"
          exit 0
        fi
        cd backend
        mvn -q -B test jacoco:report
        test -f target/site/jacoco/jacoco.xml || { echo "Falta backend/target/site/jacoco/jacoco.xml"; exit 3; }

  - name: wait-for-sonar
    image: curlimages/curl:8.9.1
    environment:
      SONAR_HOST_URL:
        from_secret: sonar_host_url
    depends_on: [ test-backend ]
    extra_hosts:
      - host.docker.internal:host-gateway
    commands:
      - |
        set -eu
        echo "Esperando $SONAR_HOST_URL ..."
        for i in $(seq 1 60); do
          if curl -fsS "$SONAR_HOST_URL/api/system/status" | grep -q '"status":"UP"'; then
            echo "SonarQube listo (status=UP)"; exit 0
          fi
          sleep 5
        done
        echo "Timeout esperando SonarQube (status!=UP)"; exit 8

  - name: sonar-backend-pr
    image: maven:3.9.9-eclipse-temurin-17
    when:
      event: [ pull_request ]
    environment:
      SONAR_HOST_URL:
        from_secret: sonar_host_url
      SONAR_TOKEN:
        from_secret: sonar_token
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on: [ wait-for-sonar ]
    commands:
      - |
        set -eu
        if [ ! -f backend/pom.xml ]; then
          echo "No hay backend → omitiendo análisis"
          exit 0
        fi
        test -n "${SONAR_TOKEN:-}" || { echo "Falta secreto sonar_token"; exit 2; }
        cd backend
        mvn -B sonar:sonar \
          -DskipTests \
          -Dsonar.projectKey=M2:Backend_PR-${DRONE_PULL_REQUEST} \
          -Dsonar.projectName=M2:Backend_PR-${DRONE_PULL_REQUEST} \
          -Dsonar.host.url="$SONAR_HOST_URL" \
          -Dsonar.token="$SONAR_TOKEN" \
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
          -Dsonar.qualitygate.wait=true \
          -Dsonar.qualitygate.timeout=600

  - name: sonar-backend-dev
    image: maven:3.9.9-eclipse-temurin-17
    when:
      event: [ push ]
      branch: [ dev ]
    environment:
      SONAR_HOST_URL:
        from_secret: sonar_host_url
      SONAR_TOKEN:
        from_secret: sonar_token
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on: [ wait-for-sonar ]
    commands:
      - |
        set -eu
        if [ ! -f backend/pom.xml ]; then
          echo "No hay backend → omitiendo análisis"
          exit 0
        fi
        test -n "${SONAR_TOKEN:-}" || { echo "Falta secreto sonar_token"; exit 2; }
        cd backend
        mvn -B sonar:sonar \
          -DskipTests \
          -Dsonar.projectKey=M2:Backend_Dev \
          -Dsonar.projectName=M2:Backend_Dev \
          -Dsonar.host.url="$SONAR_HOST_URL" \
          -Dsonar.token="$SONAR_TOKEN" \
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
          -Dsonar.qualitygate.wait=true \
          -Dsonar.qualitygate.timeout=600

  - name: sonar-backend-uat
    image: maven:3.9.9-eclipse-temurin-17
    when:
      event: [ push ]
      branch: [ uat ]
    environment:
      SONAR_HOST_URL:
        from_secret: sonar_host_url
      SONAR_TOKEN:
        from_secret: sonar_token
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on: [ wait-for-sonar ]
    commands:
      - |
        set -eu
        if [ ! -f backend/pom.xml ]; then
          echo "No hay backend → omitiendo análisis"
          exit 0
        fi
        test -n "${SONAR_TOKEN:-}" || { echo "Falta secreto sonar_token"; exit 2; }
        cd backend
        mvn -B sonar:sonar \
          -DskipTests \
          -Dsonar.projectKey=M2:Backend_Uat \
          -Dsonar.projectName=M2:Backend_Uat \
          -Dsonar.host.url="$SONAR_HOST_URL" \
          -Dsonar.token="$SONAR_TOKEN" \
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
          -Dsonar.qualitygate.wait=true \
          -Dsonar.qualitygate.timeout=600

  - name: sonar-backend-prod
    image: maven:3.9.9-eclipse-temurin-17
    when:
      event: [ push ]
      branch: [ prod ]
    environment:
      SONAR_HOST_URL:
        from_secret: sonar_host_url
      SONAR_TOKEN:
        from_secret: sonar_token
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on: [ wait-for-sonar ]
    commands:
      - |
        set -eu
        if [ ! -f backend/pom.xml ]; then
          echo "No hay backend → omitiendo análisis"
          exit 0
        fi
        test -n "${SONAR_TOKEN:-}" || { echo "Falta secreto sonar_token"; exit 2; }
        cd backend
        VER=$(git describe --tags --always 2>/dev/null || echo "${DRONE_BUILD_NUMBER}")
        mvn -B sonar:sonar \
          -DskipTests \
          -Dsonar.projectKey=M2:Backend_Prod \
          -Dsonar.projectName=M2:Backend_Prod \
          -Dsonar.projectVersion="$VER" \
          -Dsonar.host.url="$SONAR_HOST_URL" \
          -Dsonar.token="$SONAR_TOKEN" \
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
          -Dsonar.qualitygate.wait=true \
          -Dsonar.qualitygate.timeout=600

  # =========================
  # === FRONTEND (build + tests + sonar)
  # =========================
  - name: build-frontend
    image: node:20
    depends_on:
      - sonar-backend-dev
      - sonar-backend-uat
      - sonar-backend-prod
      - sonar-backend-pr
    commands:
      - |
        set -eu
        if [ ! -f package.json ]; then
          echo "No hay frontend en raíz → omitiendo build"
          exit 0
        fi
        npm ci --no-audit --no-fund
        npm run build || true

  - name: test-frontend
    image: node:20
    environment:
      CI: "true"
    depends_on: [ build-frontend ]
    commands:
      - |
        set -eu
        if [ ! -f package.json ]; then
          echo "No hay frontend en raíz → omitiendo tests"
          exit 0
        fi
        npm ci --no-audit --no-fund

        # Ejecutar test:ci si existe; si no, fallback a test; si no hay tests, salir OK
        if node -e "p=require('./package.json');process.exit(p.scripts && p.scripts['test:ci'] ? 0 : 1)"; then
          npm run test:ci
        elif node -e "p=require('./package.json');process.exit(p.scripts && p.scripts['test'] ? 0 : 1)"; then
          npm test -- --ci || npm test
        else
          echo 'No hay scripts de prueba (test/test:ci) → omitiendo tests'
          exit 0
        fi

        # En PR no exigimos cobertura; en push sí
        if [ "${DRONE_BUILD_EVENT}" = "pull_request" ]; then
          if [ ! -f coverage/lcov.info ]; then
            echo "Aviso: PR sin coverage/lcov.info (Sonar se ejecutará sin cobertura)"
          fi
        else
          test -f coverage/lcov.info || { echo "No existe coverage/lcov.info"; exit 3; }
        fi

  # --- PR: Sonar Frontend (usa la imagen oficial + secretos por step) ---
  - name: sonar-frontend-pr
    image: sonarsource/sonar-scanner-cli:5
    when:
      event: [ pull_request ]
    environment:
      SONAR_HOST_URL:
        from_secret: sonar_host_url
      SONAR_TOKEN:
        from_secret: sonar_token
      SONAR_USER_HOME: /tmp/sonar
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on: [ test-frontend, wait-for-sonar ]
    commands:
      - |
        set -eu
        if [ ! -f package.json ]; then
          echo "No hay frontend en raíz → omitiendo análisis"; exit 0
        fi

        test -n "${SONAR_TOKEN:-}" || { echo "Falta secreto sonar_token"; exit 2; }
        EXCLS="backend/**,**/*.java,node_modules/**,dist/**,coverage/**,.vite/**"

        # Clave por rama destino del PR (igual que tu compa)
        case "$DRONE_TARGET_BRANCH" in
          dev)  KEY="M2:Frontend_Dev" ;;
          uat)  KEY="M2:Frontend_Uat" ;;
          prod) KEY="M2:Frontend_Prod" ;;
          *)    KEY="M2:Frontend_Dev" ;;
        esac

        if [ -f coverage/lcov.info ]; then
          sonar-scanner \
            -Dsonar.projectKey="$KEY" \
            -Dsonar.projectBaseDir=. \
            -Dsonar.sources=src \
            -Dsonar.exclusions="${EXCLS}" \
            -Dsonar.tests=src \
            -Dsonar.test.inclusions=**/*.spec.*,**/__tests__/**/*.*,**/tests/**/*.* \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=600
        else
          echo "Ejecutando Sonar PR sin cobertura"
          sonar-scanner \
            -Dsonar.projectKey="$KEY" \
            -Dsonar.projectBaseDir=. \
            -Dsonar.sources=src \
            -Dsonar.exclusions="${EXCLS}" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=600
        fi

  # --- PUSH: Sonar Frontend por rama ---
  - name: sonar-frontend-dev
    image: sonarsource/sonar-scanner-cli:5
    when:
      event: [ push ]
      branch: [ dev ]
    environment:
      SONAR_HOST_URL:
        from_secret: sonar_host_url
      SONAR_TOKEN:
        from_secret: sonar_token
      SONAR_USER_HOME: /tmp/sonar
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on: [ test-frontend, wait-for-sonar ]
    commands:
      - |
        set -eu
        if [ ! -f package.json ]; then
          echo "No hay frontend en raíz → omitiendo análisis"
          exit 0
        fi
        test -f coverage/lcov.info || { echo "No existe coverage/lcov.info"; exit 3; }
        test -n "${SONAR_TOKEN:-}" || { echo "Falta secreto sonar_token"; exit 2; }
        EXCLS="backend/**,**/*.java,node_modules/**,dist/**,coverage/**,.vite/**"
        sonar-scanner \
          -Dsonar.projectKey=M2:Frontend_Dev \
          -Dsonar.projectBaseDir=. \
          -Dsonar.sources=src \
          -Dsonar.exclusions="${EXCLS}" \
          -Dsonar.tests=src \
          -Dsonar.test.inclusions=**/*.spec.*,**/__tests__/**/*.*,**/tests/**/*.* \
          -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
          -Dsonar.host.url="$SONAR_HOST_URL" \
          -Dsonar.token="$SONAR_TOKEN" \
          -Dsonar.qualitygate.wait=true \
          -Dsonar.qualitygate.timeout=600

  - name: sonar-frontend-uat
    image: sonarsource/sonar-scanner-cli:5
    when:
      event: [ push ]
      branch: [ uat ]
    environment:
      SONAR_HOST_URL:
        from_secret: sonar_host_url
      SONAR_TOKEN:
        from_secret: sonar_token
      SONAR_USER_HOME: /tmp/sonar
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on: [ test-frontend, wait-for-sonar ]
    commands:
      - |
        set -eu
        if [ ! -f package.json ]; then
          echo "No hay frontend en raíz → omitiendo análisis"
          exit 0
        fi
        test -f coverage/lcov.info || { echo "No existe coverage/lcov.info"; exit 3; }
        test -n "${SONAR_TOKEN:-}" || { echo "Falta secreto sonar_token"; exit 2; }
        EXCLS="backend/**,**/*.java,node_modules/**,dist/**,coverage/**,.vite/**"
        sonar-scanner \
          -Dsonar.projectKey=M2:Frontend_Uat \
          -Dsonar.projectBaseDir=. \
          -Dsonar.sources=src \
          -Dsonar.exclusions="${EXCLS}" \
          -Dsonar.tests=src \
          -Dsonar.test.inclusions=**/*.spec.*,**/__tests__/**/*.*,**/tests/**/*.* \
          -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
          -Dsonar.host.url="$SONAR_HOST_URL" \
          -Dsonar.token="$SONAR_TOKEN" \
          -Dsonar.qualitygate.wait=true \
          -Dsonar.qualitygate.timeout=600

  - name: sonar-frontend-prod
    image: sonarsource/sonar-scanner-cli:5
    when:
      event: [ push ]
      branch: [ prod ]
    environment:
      SONAR_HOST_URL:
        from_secret: sonar_host_url
      SONAR_TOKEN:
        from_secret: sonar_token
      SONAR_USER_HOME: /tmp/sonar
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on: [ test-frontend, wait-for-sonar ]
    commands:
      - |
        set -eu
        if [ ! -f package.json ]; then
          echo "No hay frontend en raíz → omitiendo análisis"
          exit 0
        fi
        test -f coverage/lcov.info || { echo "No existe cobertura/lcov.info"; exit 3; }
        test -n "${SONAR_TOKEN:-}" || { echo "Falta secreto sonar_token"; exit 2; }
        EXCLS="backend/**,**/*.java,node_modules/**,dist/**,coverage/**,.vite/**"
        sonar-scanner \
          -Dsonar.projectKey=M2:Frontend_Prod \
          -Dsonar.projectBaseDir=. \
          -Dsonar.sources=src \
          -Dsonar.exclusions="${EXCLS}" \
          -Dsonar.tests=src \
          -Dsonar.test.inclusions=**/*.spec.*,**/__tests__/**/*.*,**/tests/**/*.* \
          -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
          -Dsonar.host.url="$SONAR_HOST_URL" \
          -Dsonar.token="$SONAR_TOKEN" \
          -Dsonar.qualitygate.wait=true \
          -Dsonar.qualitygate.timeout=600

  # =========================
  # =======  DEPLOYS  =======
  # =========================
  - name: build-backend-artifact
    image: maven:3.9-eclipse-temurin-17
    when:
      event: [ push ]
      branch: [ dev, uat, prod ]
    commands:
      - |
        set -eu
        if [ ! -f backend/pom.xml ]; then
          echo "No hay backend → omitiendo empaquetado"
          exit 0
        fi
        cd backend
        mvn -B -DskipTests clean package

  - name: deploy-dev
    image: docker:26-cli
    when:
      event: [ push ]
      branch: [ dev ]
    depends_on:
      - sonar-frontend-dev
      - build-backend-artifact
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - |
        set -eu
        apk add --no-cache docker-cli-compose
        docker compose -p m2dev -f deploy/docker-compose.dev.yml down --remove-orphans || true
        docker rm -f oracle-xe-dev-m2 backend-dev-m2 frontend-dev-m2 2>/dev/null || true
        docker network rm m2-dev-net 2>/dev/null || true
        docker compose -p m2dev -f deploy/docker-compose.dev.yml up -d --build

  - name: deploy-uat
    image: docker:26-cli
    when:
      event: [ push ]
      branch: [ uat ]
    depends_on:
      - sonar-frontend-uat
      - build-backend-artifact
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - |
        set -eu
        apk add --no-cache docker-cli-compose
        docker compose -p m2uat -f deploy/docker-compose.uat.yml down --remove-orphans || true
        docker rm -f oracle-xe-uat-m2 backend-uat-m2 frontend-uat-m2 2>/dev/null || true
        docker network rm m2-uat-net 2>/dev/null || true
        docker compose -p m2uat -f deploy/docker-compose.uat.yml up -d --build

  - name: deploy-prod
    image: docker:26-cli
    when:
      event: [ push ]
      branch: [ prod ]
    depends_on:
      - sonar-frontend-prod
      - build-backend-artifact
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - |
        set -eu
        apk add --no-cache docker-cli-compose
        docker compose -p m2prod -f deploy/docker-compose.prod.yml down --remove-orphans || true
        docker rm -f oracle-xe-prod-m2 backend-prod-m2 frontend-prod-m2 2>/dev/null || true
        docker network rm m2-prod-net 2>/dev/null || true
        docker compose -p m2prod -f deploy/docker-compose.prod.yml up -d --build

  # =========================
  # ===== NOTIFICACIONES ====
  # =========================
  - name: notify-failure
    image: appleboy/drone-email
    when:
      status: [ failure ]
    settings:
      host:
        from_secret: smtp_host
      port:
        from_secret: smtp_port
      username:
        from_secret: smtp_user
      password:
        from_secret: smtp_pass
      from:
        from_secret: smtp_from
      subject: "[Drone] Falló ${DRONE_REPO} #${DRONE_BUILD_NUMBER} (${DRONE_EVENT} @ ${DRONE_BRANCH})"
      to:
        - hecheverria@unis.edu.gt
        - jflores@unis.edu.gt

volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock
