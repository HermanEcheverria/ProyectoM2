version: "3.9"
name: m2uat

networks:
  m2-uat-net:
    external: true

services:
  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      - QUARKUS_DATASOURCE_DB_KIND=oracle
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:oracle:thin:@oracle-xe:1521/XEPDB1
      - QUARKUS_DATASOURCE_USERNAME=PROYECTO_UAT
      - QUARKUS_DATASOURCE_PASSWORD=UnisUat
      - QUARKUS_HIBERNATE_ORM_DATABASE_DEFAULT_SCHEMA=PROYECTO_UAT
      - QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION=update
      - QUARKUS_HTTP_HOST=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/q/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - m2-uat-net

  frontend:
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8083:80"
    networks:
      - m2-uat-net
