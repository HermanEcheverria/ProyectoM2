version: "3.9"
name: m2dev
services:
  backend:
    build:
      context: ../backend
    container_name: m2-backend-dev
    environment:
      - QUARKUS_DATASOURCE_DB_KIND=oracle
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:oracle:thin:@oracle-xe:1521/XEPDB1
      - QUARKUS_DATASOURCE_USERNAME=PROYECTO_DEV
      - QUARKUS_DATASOURCE_PASSWORD=UnisDev
      - QUARKUS_HIBERNATE_ORM_DATABASE_DEFAULT_SCHEMA=PROYECTO_DEV
      - QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION=update
      - QUARKUS_HTTP_HOST=0.0.0.0
    networks: [m2-dev-net]

  frontend:
    build:
      context: ..
    container_name: m2-frontend-dev
    depends_on: [backend]
    ports:
      - "8082:80"
    networks: [m2-dev-net]

networks:
  m2-dev-net:
    external: true
