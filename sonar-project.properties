sonar.projectKey=proyecto-m2-frontend
sonar.projectName=ProyectoM2 :: Frontend
sonar.sourceEncoding=UTF-8

# Fuentes del front (ajusta a "." si no usas /src)
sonar.sources=src

# Excluir build, dependencias y tests
sonar.exclusions=node_modules/**,dist/**,coverage/**,.vite/**,**/*.spec.ts,**/*.spec.js,**/*.test.ts,**/*.test.js

# Desactivar cobertura en el frontend para no afectar el Quality Gate
sonar.coverage.exclusions=**/*
