# Identidad por rama (dev/uat/main)
sonar.projectKey=proyecto-m2-${env.BRANCH_NAME}
sonar.projectName=ProyectoM2 (${env.BRANCH_NAME})
sonar.sourceEncoding=UTF-8

# ====== SOURCES (código productivo) ======
# Backend (Java) + Front (root ./src)
sonar.sources=backend/src/main/java,src

# Excluir artefactos típicos
sonar.exclusions=**/target/**,**/node_modules/**,**/dist/**,**/build/**

# ====== TESTS (código de pruebas) ======
# Señalamos dónde están los tests (backend y front)
sonar.tests=backend/src/test/java,src

# Incluimos explícitamente patrones de tests (Java y JS/TS)
sonar.test.inclusions=backend/src/test/java/**/*.java,src/**/*.{spec,test}.{js,jsx,ts,tsx}

# Forzamos a que NADA bajo backend/src/main/** sea tratado como test
sonar.test.exclusions=backend/src/main/**

# ====== Java / JaCoCo ======
sonar.java.binaries=backend/target/classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
