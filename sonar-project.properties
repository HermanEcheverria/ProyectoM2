# Identidad por rama
sonar.projectKey=proyecto-m2-${env.BRANCH_NAME}
sonar.projectName=ProyectoM2 (${env.BRANCH_NAME})
sonar.sourceEncoding=UTF-8

# Fuentes: Java del backend + frontend en la RAÍZ (.)
sonar.sources=backend/src/main/java,.

# Tests: Java + JS/TS
sonar.tests=backend/src/test/java,.
sonar.test.inclusions=backend/src/test/java/**/*.java,**/*.{spec,test}.{js,jsx,ts,tsx}

# Excluir artefactos de build, node_modules, dist, etc.
sonar.exclusions=**/target/**,**/node_modules/**,**/dist/**,**/build/**

# Java (classpath y cobertura)
sonar.java.binaries=backend/target/classes
sonar.java.libraries=backend/target/dependency/*.jar
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# TypeScript: tsconfig EN LA RAÍZ
sonar.typescript.tsconfigPath=tsconfig.json